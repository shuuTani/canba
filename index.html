<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>canba デザイン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Kaisei+Decol:wght@400;700&family=Noto+Sans+JP:wght@400;700;900&family=Noto+Serif+JP:wght@400;700&family=Yusei+Magic&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* Layout: editor shell. Tool tabs | asset panel | artboard stage with a contextual property bar above it */
:root {
  --bg: #e9edf1;
  --panel: #ffffff;
  --ink: #17202a;
  --muted: #66707c;
  --line: #d8dde3;
  --accent: #0b8a7a;
  --accent-soft: #d9f1ed;
  --accent-ink: #ffffff;
  --danger: #c62f3b;
  --font-ui: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", system-ui, sans-serif;
  --font-num: ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14181d; --panel: #1c2229; --ink: #e7ebef; --muted: #97a1ac; --line: #2e3640;
    --accent: #3cc4b0; --accent-soft: #1a3a36; --accent-ink: #0d1714; --danger: #ff6b76; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14181d; --panel: #1c2229; --ink: #e7ebef; --muted: #97a1ac; --line: #2e3640;
  --accent: #3cc4b0; --accent-soft: #1a3a36; --accent-ink: #0d1714; --danger: #ff6b76; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 14px; overflow: hidden; }
[hidden] { display: none !important; }
button, input, select { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app {
  height: 100%;
  display: grid;
  grid-template-columns: 76px 264px minmax(0, 1fr);
  grid-template-rows: auto minmax(0, 1fr);
  grid-template-areas: "top top top" "tabs panel work";
}

/* top bar */
.top {
  grid-area: top; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding-inline: 16px; padding-block: 10px;
  background: var(--panel); border-bottom: 1px solid var(--line);
}
.brand { font-weight: 700; font-size: 1.25rem; letter-spacing: .02em; }
.brand span { color: var(--accent); }
.sizepick { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: .8rem; }
select, input[type="number"] {
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px; height: 34px; padding: 0 8px;
}
.top .spacer { flex: 1; }
.btn {
  background: transparent; border: 1px solid var(--line); border-radius: 8px; height: 34px; min-width: 34px;
  padding: 0 12px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  white-space: nowrap;
}
.btn:hover { border-color: var(--muted); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.icon { padding: 0; width: 34px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.btn.danger { color: var(--danger); }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* tool tabs */
.tabs { grid-area: tabs; display: flex; flex-direction: column; gap: 4px; padding: 10px 6px; background: var(--panel); border-right: 1px solid var(--line); }
.tab {
  background: transparent; border: 0; border-radius: var(--r); padding: 10px 2px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: .7rem; color: var(--muted);
}
.tab svg.i { width: 22px; height: 22px; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); }

/* asset panel */
.panel { grid-area: panel; background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 16px; display: grid; align-content: start; gap: 14px; }
.panel h2 { margin: 0; font-size: .95rem; }
.panel .note { margin: 0; color: var(--muted); font-size: .78rem; line-height: 1.6; }
.tpl-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tpl { background: none; border: 0; padding: 0; cursor: pointer; display: grid; gap: 6px; text-align: left; font-size: .75rem; color: var(--muted); }
.tpl canvas { width: 100%; aspect-ratio: 1; border-radius: 8px; border: 1px solid var(--line); display: block; }
.tpl:hover canvas { border-color: var(--accent); }
.add-text { display: grid; gap: 8px; }
.add-text button {
  text-align: left; background: var(--bg); border: 1px solid transparent; border-radius: var(--r); padding: 12px 14px; cursor: pointer;
}
.add-text button:hover { border-color: var(--accent); }
.font-list { display: grid; gap: 6px; }
.font-list button { text-align: left; background: none; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; cursor: pointer; font-size: 1.05rem; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.font-list button small { font-family: var(--font-ui); font-size: .7rem; color: var(--muted); }
.font-list button:hover { border-color: var(--accent); }
.shape-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.shape-grid button { aspect-ratio: 1; background: var(--bg); border: 1px solid transparent; border-radius: var(--r); cursor: pointer; display: grid; place-items: center; gap: 4px; padding: 10px; font-size: .7rem; color: var(--muted); }
.shape-grid button:hover { border-color: var(--accent); }
.shape-grid svg { width: 44px; height: 44px; fill: var(--ink); }
.swatch-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.swatch { aspect-ratio: 1; border-radius: 8px; border: 1px solid var(--line); cursor: pointer; padding: 0; }
.swatch[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: 2px; }
.color-row { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: .8rem; }
input[type="color"] { width: 34px; height: 34px; border: 1px solid var(--line); border-radius: 8px; padding: 2px; background: var(--panel); cursor: pointer; }

/* work area */
.work { grid-area: work; display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; }
.propbar {
  display: flex; align-items: center; gap: 8px; padding: 8px 16px; min-height: 52px;
  background: var(--panel); border-bottom: 1px solid var(--line);
  overflow-x: auto; white-space: nowrap;
}
.propbar .hint { color: var(--muted); font-size: .8rem; }
.propbar .sep { width: 1px; align-self: stretch; background: var(--line); margin: 4px 4px; flex: none; }
.propbar label.inline { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: .78rem; }
.propbar input[type="number"] { width: 64px; font-family: var(--font-num); }
.propbar input[type="range"] { width: 90px; accent-color: var(--accent); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex: none; }
.seg .btn { border: 0; border-radius: 0; }

.stage { flex: 1; min-height: 0; display: grid; place-items: center; overflow: hidden; position: relative; touch-action: none; }
.board-wrap { position: relative; box-shadow: 0 2px 6px rgb(0 0 0 / .08), 0 12px 32px rgb(0 0 0 / .10); }
.board { position: absolute; left: 0; top: 0; transform-origin: 0 0; overflow: hidden; }
.el { position: absolute; touch-action: none; cursor: move; user-select: none; -webkit-user-select: none; }
.el:hover { outline: calc(2px / var(--s, 1)) solid var(--accent); }
.el.text { white-space: pre-wrap; word-break: break-all; line-height: 1.3; }
.el.text[contenteditable="true"] { cursor: text; user-select: text; -webkit-user-select: text; outline: none; }
.el svg { width: 100%; height: 100%; display: block; }

.selbox { position: absolute; border: 2px solid var(--accent); pointer-events: none; transform-origin: center; }
.selbox .h { position: absolute; width: 14px; height: 14px; background: #ffffff; border: 2px solid var(--accent); border-radius: 50%; pointer-events: auto; touch-action: none; }
.selbox .nw { left: -8px; top: -8px; cursor: nwse-resize; }
.selbox .ne { right: -8px; top: -8px; cursor: nesw-resize; }
.selbox .sw { left: -8px; bottom: -8px; cursor: nesw-resize; }
.selbox .se { right: -8px; bottom: -8px; cursor: nwse-resize; }
.selbox .rot {
  position: absolute; left: 50%; bottom: -40px; width: 26px; height: 26px; margin-left: -13px; border-radius: 50%;
  background: var(--panel); border: 1px solid var(--line); box-shadow: 0 1px 4px rgb(0 0 0 / .2);
  pointer-events: auto; cursor: grab; touch-action: none; display: grid; place-items: center; color: var(--ink);
}
.selbox .rot svg { width: 14px; height: 14px; }
.guide { position: absolute; background: #ff3d8b; pointer-events: none; }
.guide.v { top: 0; bottom: 0; width: 1px; }
.guide.h { left: 0; right: 0; height: 1px; }
.zoom { position: absolute; right: 16px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); font-family: var(--font-num); font-size: .72rem; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; font-variant-numeric: tabular-nums; }

.toast {
  position: fixed; left: 50%; bottom: calc(28px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--ink); color: var(--panel); padding: 8px 14px; border-radius: 10px; font-size: .85rem;
  opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20;
}
.toast.show { opacity: 1; }
.overlay { position: fixed; inset: 0; background: rgb(0 0 0 / .5); display: grid; place-items: center; padding: 16px; z-index: 30; }
.dialog { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; max-width: min(720px, 100%); display: grid; gap: 12px; }
.dialog p { margin: 0; font-size: .9rem; }
.dialog img { max-width: 100%; max-height: 62vh; border-radius: 8px; border: 1px solid var(--line); justify-self: center; }
.dialog .row { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }

@media (max-width: 760px) {
  .app {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr) auto auto;
    grid-template-areas: "top" "work" "panel" "tabs";
  }
  .tabs { flex-direction: row; justify-content: space-around; border-right: 0; border-top: 1px solid var(--line); padding: 6px 16px calc(6px + env(safe-area-inset-bottom, 0px)); }
  .tab { flex: 1; }
  .panel { border-right: 0; border-top: 1px solid var(--line); max-height: 32vh; }
  .tpl-grid { grid-template-columns: repeat(4, 1fr); }
  .swatch-grid { grid-template-columns: repeat(8, 1fr); }
  .shape-grid { grid-template-columns: repeat(6, 1fr); }
  .shape-grid svg { width: 28px; height: 28px; }
  .sizepick span, .brand { display: none; }
  .top { gap: 6px; flex-wrap: nowrap; }
  .top .spacer { display: none; }
  .sizepick { flex: 1; min-width: 0; }
  .sizepick select { width: 100%; }
  #exportBtn svg { display: none; }
  .btn.label-hide span { display: none; }
}
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">can<span>ba</span></div>
    <label class="sizepick"><span>サイズ</span><select id="sizeSel" aria-label="デザインのサイズ"></select></label>
    <span class="spacer"></span>
    <button class="btn icon" id="undo" title="元に戻す (Ctrl+Z)" aria-label="元に戻す"><svg class="i" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg></button>
    <button class="btn icon" id="redo" title="やり直す (Ctrl+Shift+Z)" aria-label="やり直す"><svg class="i" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 000 12h3"/></svg></button>
    <button class="btn primary" id="exportBtn"><svg class="i" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>画像にする</button>
  </header>

  <nav class="tabs" role="tablist" aria-label="素材">
    <button class="tab" role="tab" data-panel="templates" aria-selected="true"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>テンプレート</button>
    <button class="tab" role="tab" data-panel="text" aria-selected="false"><svg class="i" viewBox="0 0 24 24"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg>文字</button>
    <button class="tab" role="tab" data-panel="shapes" aria-selected="false"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="12" width="9" height="9" rx="1"/><circle cx="16.5" cy="7.5" r="4.5"/></svg>図形</button>
    <button class="tab" role="tab" data-panel="bg" aria-selected="false"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 15l5-5 4 4 3-3 6 6"/></svg>背景</button>
  </nav>

  <aside class="panel" id="panel" role="tabpanel"></aside>

  <main class="work">
    <div class="propbar" id="propbar"></div>
    <div class="stage" id="stage">
      <div class="board-wrap" id="wrap">
        <div class="board" id="board"></div>
        <div class="guide v" id="gv" hidden></div>
        <div class="guide h" id="gh" hidden></div>
        <div class="selbox" id="selbox" hidden>
          <span class="h nw" data-c="-1,-1"></span><span class="h ne" data-c="1,-1"></span>
          <span class="h sw" data-c="-1,1"></span><span class="h se" data-c="1,1"></span>
          <span class="rot" id="rotH" title="ドラッグで回転"><svg class="i" viewBox="0 0 24 24"><path d="M20 12a8 8 0 11-3-6.2"/><path d="M20 4v5h-5"/></svg></span>
        </div>
      </div>
    </div>
    <div class="zoom" id="zoom">100%</div>
  </main>
</div>
<div class="toast" id="toast" role="status"></div>
<div class="overlay" id="overlay" hidden></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const stage = $('stage'), wrap = $('wrap'), board = $('board'), selbox = $('selbox');
  const panel = $('panel'), propbar = $('propbar');

  // ---------- constants
  const SIZES = {
    square: { w: 1080, h: 1080, label: 'Instagram 投稿（1080×1080）' },
    story: { w: 1080, h: 1920, label: 'ストーリー（1080×1920）' },
    slide: { w: 1920, h: 1080, label: 'プレゼン（1920×1080）' },
    a4: { w: 1240, h: 1754, label: 'A4 チラシ（1240×1754）' },
  };
  const FONTS = [
    { id: 'Noto Sans JP', label: 'ゴシック' },
    { id: 'Zen Maru Gothic', label: '丸ゴシック' },
    { id: 'Noto Serif JP', label: '明朝' },
    { id: 'Dela Gothic One', label: '極太' },
    { id: 'Kaisei Decol', label: 'デコール' },
    { id: 'Yusei Magic', label: '手書き風' },
  ];
  const fontCss = f => `"${f}", "Hiragino Sans", "Yu Gothic", sans-serif`;
  const SWATCHES = ['#ffffff', '#f6f1e7', '#e9edf1', '#17202a', '#1f3d36', '#203a72',
                    '#ffd23f', '#ff8f3d', '#e63946', '#ff8fab', '#7b5cff', '#2f6fed',
                    '#0b8a7a', '#8ac926', '#e9c46a', '#a3c4f3', '#c9b6e4', '#5c4033'];
  const LH = 1.3;
  const SHAPES = [
    { shape: 'rect', label: '四角' },
    { shape: 'round', label: '角丸' },
    { shape: 'ellipse', label: '丸' },
    { shape: 'triangle', label: '三角' },
    { shape: 'star', label: '星' },
    { shape: 'line', label: '線' },
  ];
  const STAR = (() => {
    const p = [];
    for (let i = 0; i < 10; i++) {
      const r = i % 2 ? 21 : 50, a = -Math.PI / 2 + i * Math.PI / 5;
      p.push([50 + Math.cos(a) * r, 52 + Math.sin(a) * r]);
    }
    return p;
  })();
  const POLY = { triangle: [[50, 0], [100, 100], [0, 100]], star: STAR };

  let seq = 0;
  const nid = () => 'e' + Date.now().toString(36) + (seq++).toString(36);
  const T = o => Object.assign({ type: 'text', rot: 0, opacity: 1, font: 'Noto Sans JP', weight: 700, align: 'center', color: '#17202a', h: 0 }, o, { id: nid() });
  const S = o => Object.assign({ type: 'shape', shape: 'rect', rot: 0, opacity: 1, fill: '#2f6fed', radius: 0 }, o, { id: nid() });

  // Templates are authored on a 1080×1080 board and fitted to the chosen size.
  const TEMPLATES = [
    { name: '秋の新メニュー', make: () => ({ size: 'square', bg: '#1f3d36', els: [
      S({ shape: 'ellipse', x: 600, y: -140, w: 640, h: 640, fill: '#e9c46a' }),
      S({ shape: 'ellipse', x: -170, y: 780, w: 420, h: 420, fill: '#2a5a4f' }),
      T({ x: 90, y: 130, w: 900, text: 'AUTUMN MENU', fontSize: 40, color: '#e9c46a', align: 'left' }),
      T({ x: 90, y: 200, w: 900, text: '秋の\n新メニュー', fontSize: 150, font: 'Dela Gothic One', weight: 400, color: '#ffffff', align: 'left' }),
      T({ x: 90, y: 630, w: 860, text: 'かぼちゃのチーズケーキ　580円\nほうじ茶ラテ　520円', fontSize: 44, font: 'Zen Maru Gothic', color: '#f1efe6', align: 'left' }),
      S({ shape: 'rect', x: 90, y: 870, w: 400, h: 96, fill: '#e9c46a', radius: 48 }),
      T({ x: 90, y: 893, w: 400, text: '10.15 SAT START', fontSize: 38, weight: 900, color: '#1f3d36' }),
    ] }) },
    { name: 'セール告知', make: () => ({ size: 'square', bg: '#ffd23f', els: [
      S({ shape: 'star', x: 600, y: 520, w: 440, h: 440, fill: '#e63946', rot: 12 }),
      T({ x: 60, y: 110, w: 960, text: 'BIG SALE', fontSize: 150, font: 'Dela Gothic One', weight: 400, color: '#17202a', align: 'left' }),
      T({ x: 64, y: 390, w: 900, text: 'ご愛顧感謝セール', fontSize: 72, weight: 900, color: '#17202a', align: 'left' }),
      T({ x: 640, y: 680, w: 360, text: '最大\n50%OFF', fontSize: 64, font: 'Dela Gothic One', weight: 400, color: '#ffffff', rot: 12 }),
      S({ shape: 'rect', x: 64, y: 900, w: 520, h: 8, fill: '#17202a' }),
      T({ x: 64, y: 930, w: 640, text: '10.20 SUN まで｜全店舗', fontSize: 40, color: '#17202a', align: 'left' }),
    ] }) },
    { name: 'ハッカソン招待', make: () => ({ size: 'square', bg: '#dfe8fb', els: [
      S({ shape: 'round', x: 60, y: 60, w: 960, h: 960, fill: '#ffffff', radius: 40 }),
      S({ shape: 'ellipse', x: 690, y: 600, w: 200, h: 200, fill: '#2f6fed' }),
      S({ shape: 'triangle', x: 790, y: 720, w: 220, h: 200, fill: '#7b5cff', opacity: .9 }),
      T({ x: 130, y: 150, w: 820, text: 'INVITATION', fontSize: 36, color: '#2f6fed', align: 'left' }),
      T({ x: 130, y: 210, w: 820, text: '社内ハッカソン\n2026', fontSize: 108, weight: 900, color: '#17202a', align: 'left' }),
      T({ x: 130, y: 520, w: 700, text: '11月8日(土) 10:00〜19:00\n会場：本社 3F ラウンジ', fontSize: 42, font: 'Zen Maru Gothic', color: '#3b4652', align: 'left' }),
      T({ x: 130, y: 790, w: 560, text: 'テーマは「毎日をちょっと楽にする道具」。ひとりでもチームでも参加できます。', fontSize: 30, weight: 400, color: '#66707c', align: 'left' }),
    ] }) },
    { name: '白紙', make: () => ({ size: 'square', bg: '#ffffff', els: [] }) },
  ];

  // ---------- state
  let doc, selId = null, editingId = null, scale = 1;
  const nodes = new Map();
  let undoStack = [], redoStack = [], lastSnap = null;
  const STORE = 'canba-design-v1';

  const sel = () => doc.els.find(e => e.id === selId) || null;
  const byId = id => doc.els.find(e => e.id === id);

  function fitDoc(d, size) {
    const a = SIZES[d.size], b = SIZES[size];
    if (a === b) return d;
    const k = Math.min(b.w / a.w, b.h / a.h), ox = (b.w - a.w * k) / 2, oy = (b.h - a.h * k) / 2;
    d.els.forEach(e => {
      e.x = e.x * k + ox; e.y = e.y * k + oy; e.w *= k; e.h *= k;
      if (e.fontSize) e.fontSize *= k;
      if (e.radius) e.radius *= k;
    });
    d.size = size;
    return d;
  }

  // ---------- persistence & history
  function save() { try { localStorage.setItem(STORE, lastSnap); } catch (_) {} }
  function load() {
    try {
      const s = localStorage.getItem(STORE);
      if (s) { const d = JSON.parse(s); if (d && SIZES[d.size] && Array.isArray(d.els)) return d; }
    } catch (_) {}
    return null;
  }
  function commit() {
    const s = JSON.stringify(doc);
    if (s === lastSnap) return;
    if (lastSnap) undoStack.push(lastSnap);

        if (line && ctx.measureText(t).width > maxW + 0.5) { out.push(line); line = ch; } else line = t;
      }
      out.push(line);
    }
    return out;
  }
  function drawEl(ctx, e) {
    ctx.save();
    ctx.globalAlpha = e.opacity ?? 1;
    const rad = (e.rot || 0) * Math.PI / 180;
    if (e.type === 'text') {
      ctx.font = `${e.weight} ${e.fontSize}px ${fontCss(e.font)}`;
      const lines = wrapText(ctx, e.text, e.w), lh = e.fontSize * LH, h = lines.length * lh;
      ctx.translate(e.x + e.w / 2, e.y + h / 2); ctx.rotate(rad);
      ctx.fillStyle = e.color; ctx.textAlign = e.align; ctx.textBaseline = 'middle';
      const ax = e.align === 'left' ? -e.w / 2 : e.align === 'right' ? e.w / 2 : 0;
      lines.forEach((ln, i) => ctx.fillText(ln, ax, -h / 2 + lh * i + lh / 2));
    } else {
      const w = e.w, h = e.h;
      ctx.translate(e.x + w / 2, e.y + h / 2); ctx.rotate(rad);
      ctx.fillStyle = e.fill; ctx.beginPath();
      if (e.shape === 'ellipse') ctx.ellipse(0, 0, w / 2, h / 2, 0, 0, Math.PI * 2);
      else if (POLY[e.shape]) POLY[e.shape].forEach(([px, py], i) => ctx[i ? 'lineTo' : 'moveTo'](-w / 2 + px * w / 100, -h / 2 + py * h / 100));
      else if (ctx.roundRect) ctx.roundRect(-w / 2, -h / 2, w, h, Math.min(e.radius || 0, w / 2, h / 2));
      else ctx.rect(-w / 2, -h / 2, w, h);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }
  function drawDoc(ctx, d, k) {
    const sz = SIZES[d.size];
    ctx.save(); ctx.scale(k, k);
    ctx.fillStyle = d.bg; ctx.fillRect(0, 0, sz.w, sz.h);
    d.els.forEach(e => drawEl(ctx, e));
    ctx.restore();
  }
  function loadFonts(d) {
    const jobs = d.els.filter(e => e.type === 'text').map(e => document.fonts.load(`${e.weight} ${e.fontSize}px "${e.font}"`, e.text).catch(() => {}));
    return Promise.race([Promise.all(jobs), new Promise(r => setTimeout(r, 3000))]);
  }
  $('exportBtn').addEventListener('click', async () => {
    if (editingId) nodes.get(editingId)?.blur();
    await loadFonts(doc);
    const sz = SIZES[doc.size], c = document.createElement('canvas');
    c.width = sz.w; c.height = sz.h;
    drawDoc(c.getContext('2d'), doc, 1);
    const url = c.toDataURL('image/png');
    const img = new Image(); img.src = url; img.alt = 'できあがったデザイン';
    const buttons = [];
    // DOWNLOAD-START
    buttons.push(['PNG をダウンロード', () => { const a = document.createElement('a'); a.href = url; a.download = 'canba-design.png'; a.click(); }]);
    // DOWNLOAD-END
    buttons.push(['閉じる', closeDialog]);
    showDialog(`${sz.w}×${sz.h} の画像です。画像を長押し、または右クリックで保存できます。`, img, buttons);
  });

  // ---------- dialog & toast
  const overlay = $('overlay');
  function showDialog(text, media, buttons) {
    overlay.innerHTML = '';
    const d = document.createElement('div'); d.className = 'dialog'; d.setAttribute('role', 'dialog');
    const p = document.createElement('p'); p.textContent = text; d.appendChild(p);
    if (media) d.appendChild(media);
    const row = document.createElement('div'); row.className = 'row';
    buttons.forEach(([label, fn], i) => {
      const b = document.createElement('button'); b.className = 'btn' + (i === 0 && buttons.length > 1 ? ' primary' : ''); b.textContent = label;
      b.addEventListener('click', fn); row.appendChild(b);
    });
    d.appendChild(row); overlay.appendChild(d); overlay.hidden = false;
    row.lastChild.focus();
  }
  function closeDialog() { overlay.hidden = true; overlay.innerHTML = ''; }
  overlay.addEventListener('click', ev => { if (ev.target === overlay) closeDialog(); });
  let toastTimer;
  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1600);
  }

  // ---------- keyboard
  window.addEventListener('keydown', ev => {
    if (ev.key === 'Escape') {
      if (!overlay.hidden) return closeDialog();
      if (editingId) return nodes.get(editingId)?.blur();
      return select(null);
    }
    if (editingId || /INPUT|SELECT|TEXTAREA/.test(ev.target.tagName)) return;
    const mod = ev.ctrlKey || ev.metaKey, k = ev.key.toLowerCase();
    if (mod && k === 'z') { ev.preventDefault(); ev.shiftKey ? redo() : undo(); return; }
    if (mod && k === 'y') { ev.preventDefault(); redo(); return; }
    if (mod && k === 'd') { ev.preventDefault(); duplicateSel(); return; }
    const e = sel(); if (!e) return;
    if (ev.key === 'Delete' || ev.key === 'Backspace') { ev.preventDefault(); removeSel(); return; }
    if (ev.key === 'Enter' && e.type === 'text') { ev.preventDefault(); startEdit(e.id); return; }
    const step = ev.shiftKey ? 10 : 1;
    const mv = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] }[ev.key];
    if (mv) { ev.preventDefault(); e.x += mv[0]; e.y += mv[1]; renderOne(e); commit(); }
  });

  // ---------- boot
  doc = load() || TEMPLATES[0].make();
  sizeSel.value = doc.size;
  let startPanel = 'templates';
  try { startPanel = localStorage.getItem(STORE + '-panel') || startPanel; } catch (_) {}
  if (!PANELS[startPanel]) startPanel = 'templates';
  document.querySelector(`.tab[data-panel="${startPanel}"]`).click();
  layout(); renderAll(); renderProps(); commit();
  document.fonts?.ready.then(() => { renderAll(); drawThumbs(); });
  // Canvas text doesn't trigger webfont downloads, so fetch the template glyphs explicitly.
  Promise.all(TEMPLATES.map(t => loadFonts(t.make()))).then(() => { renderAll(); drawThumbs(); });
  // Japanese webfonts arrive in slices; re-measure text whenever more glyphs load.
  document.fonts?.addEventListener?.('loadingdone', () => { renderAll(); drawThumbs(); });
})();
</script>
</body>
</html>
